<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arman Deri | Bakımda</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#070707;
color:white;

}

/* Animated Background */

body::before{

content:'';
position:absolute;
width:900px;
height:900px;
background:radial-gradient(circle,#b78d53 0%,transparent 70%);
filter:blur(180px);
opacity:.18;
animation:move 12s ease-in-out infinite;

}

body::after{

content:'';
position:absolute;
width:700px;
height:700px;
right:-250px;
bottom:-250px;
background:radial-gradient(circle,#ffffff 0%,transparent 70%);
opacity:.05;
filter:blur(140px);

}

@keyframes move{

0%{transform:translate(-120px,-80px);}
50%{transform:translate(120px,80px);}
100%{transform:translate(-120px,-80px);}

}

.container{

position:relative;
z-index:5;
width:90%;
max-width:700px;

padding:70px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(30px);

border-radius:35px;

text-align:center;

box-shadow:
0 20px 60px rgba(0,0,0,.45),
inset 0 0 40px rgba(255,255,255,.02);

animation:float 5s ease-in-out infinite;

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}

}

.logo{

font-size:42px;
font-weight:700;
letter-spacing:6px;

margin-bottom:15px;

}

.logo span{

color:#c59b61;

}

.status{

display:inline-flex;
align-items:center;
gap:10px;

padding:10px 18px;

border-radius:40px;

background:rgba(255,255,255,.05);

margin-bottom:35px;

font-size:14px;

}

.dot{

width:10px;
height:10px;
background:#53ff9c;
border-radius:50%;
animation:pulse 1.4s infinite;

}

@keyframes pulse{

0%{transform:scale(1);box-shadow:0 0 0 rgba(83,255,156,.7);}
70%{transform:scale(1.7);box-shadow:0 0 18px rgba(83,255,156,.4);}
100%{transform:scale(1);box-shadow:0 0 0 rgba(83,255,156,0);}

}

h1{

font-size:48px;
font-weight:700;
line-height:1.2;

margin-bottom:20px;

}

p{

font-size:18px;

color:#bfbfbf;

line-height:1.9;

max-width:550px;

margin:auto;

}

.loader{

width:90px;
height:90px;

margin:50px auto;

border-radius:50%;

border:3px solid rgba(255,255,255,.08);

border-top:3px solid #c59b61;

animation:spin 1.2s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

.footer{

margin-top:20px;

font-size:13px;

letter-spacing:2px;

color:#777;

}

@media(max-width:700px){

.container{

padding:45px 30px;

}

h1{

font-size:34px;

}

.logo{

font-size:32px;

}

p{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
ARMAN <span>DERİ</span>
</div>

<div class="status">

<div class="dot"></div>

Bakım Çalışması

</div>

<h1>Bakımdayız.</h1>

<p>

Sizlere daha hızlı, daha modern ve kusursuz bir deneyim sunabilmek için
web sitemiz üzerinde çalışmalar gerçekleştiriyoruz.

<br><br>

Çok yakında yeniden sizlerle olacağız.

</p>

<div class="loader"></div>

<div class="footer">

© 2026 ARMAN DERİ

</div>

</div>

</body>
</html>
